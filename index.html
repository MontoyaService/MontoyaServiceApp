<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montoya Service</title>

<style>
*{box-sizing:border-box}
:root{--orange:#ff6a00;--black:#111;--dark:#1b1b1b;--line:#d8d8d8;--light:#f3f3f3}
body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
.container{width:100%;max-width:820px;margin:auto;padding:16px}
.card{background:#1b1b1b;border:1px solid #363636;border-radius:16px;padding:20px;margin-bottom:18px}
.section-title{margin:0 0 16px;color:var(--orange);font-size:22px}
label{display:block;margin:12px 0 6px;font-weight:700;color:#ddd}
input,select,textarea{width:100%;padding:12px;border:1px solid #555;border-radius:9px;background:#292929;color:#fff;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{min-height:85px;resize:vertical}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{margin-top:9px}
.item-grid{display:grid;grid-template-columns:1fr 70px 110px 42px;gap:7px}
.item-grid input{margin:0}
button{border:0;border-radius:10px;padding:13px 17px;font-weight:800;cursor:pointer}
.primary{width:100%;margin-top:18px;background:var(--orange);color:#fff}
.secondary{background:#333;color:#fff;margin-top:12px}
.btn-delete{background:#333;color:#ff7777;border:1px solid #555;width:42px;padding:0}
.summary{border-top:1px solid #444;margin-top:18px;padding-top:12px}
.summary-row{display:flex;justify-content:space-between;padding:5px 0}
.summary-row.total{font-size:25px;font-weight:900;border-top:2px solid var(--orange);margin-top:8px;padding-top:10px}
.catalog-row{display:flex;align-items:center;gap:10px;background:#242424;border-radius:8px;padding:8px;margin-top:6px}
.catalog-name{flex:1}.catalog-price{color:var(--orange);font-weight:700}

/* NOTA EN PANTALLA */
.note-wrapper{margin-top:20px}
.note{
 background:#fff;color:#111;max-width:820px;margin:auto;padding:22px;
 border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.35)
}
.note-header{
 background:linear-gradient(135deg,#101010,#1c1c1c);color:#fff;
 border-top:5px solid var(--orange);border-bottom:5px solid var(--orange);
 padding:14px 16px 12px
}
.brand-row{display:flex;align-items:center;gap:13px}
.brand-logo{
 width:68px;height:68px;flex:none;border-radius:50%;border:4px solid var(--orange);
 display:flex;align-items:center;justify-content:center;color:#fff;font-size:25px;font-weight:900;
 background:#111;box-shadow:inset 0 0 0 3px #333
}
.brand-logo span{color:var(--orange)}
.brand-name{font-size:30px;font-weight:900;line-height:1}
.brand-name span{color:var(--orange)}
.brand-slogan{font-size:12px;color:#ddd;font-weight:700;margin-top:6px;letter-spacing:1px}
.folio-box{margin-left:auto;border:1px solid #777;border-radius:8px;padding:9px 11px;min-width:145px;text-align:left}
.folio-box b{color:var(--orange);font-size:13px}.folio-box strong{font-size:15px}
.contact-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700}
.contact-bar div:nth-child(3){text-align:right;color:var(--orange)}
.note-title-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 9px}
.note-title{font-size:24px;font-weight:900}
.note-date{font-size:11px;text-align:right;color:#555}
.section-label{font-size:12px;font-weight:900;border-left:7px solid var(--orange);padding-left:8px;margin:10px 0 5px;text-transform:uppercase}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.info-cell{padding:7px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:43px}
.info-cell:nth-child(3n){border-right:0}
.info-cell:nth-last-child(-n+3){border-bottom:0}
.info-label{display:block;color:#777;font-size:8px;text-transform:uppercase;font-weight:800;margin-bottom:2px}
.info-value{font-size:12px;font-weight:800}
.work-box{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px;font-size:11px;line-height:1.35}
.note-table{width:100%;border-collapse:collapse;margin-top:7px;font-size:10px}
.note-table th{background:#151515;color:#fff;padding:7px 6px;text-transform:uppercase}
.note-table td{padding:5px 6px;border-bottom:1px solid var(--line);height:22px}
.note-table .num{width:25px;text-align:center}.note-table .qty{width:45px;text-align:center}.note-table .money{width:78px;text-align:right}
.note-table th:first-child{text-align:left}
.note-bottom{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:8px;margin-top:8px}
.total-box,.guarantee-box,.payment-box{border:1px solid var(--line);border-radius:8px;padding:9px;min-height:90px}
.total-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0}
.grand-total{display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;margin:6px -9px -9px;padding:8px 9px;border-radius:0 0 7px 7px;font-size:15px;font-weight:900}
.grand-total span:last-child{background:var(--orange);margin:-8px -9px -8px 0;padding:8px 9px}
.box-title{font-size:12px;font-weight:900;margin-bottom:5px}
.guarantee-box{font-size:9px;line-height:1.35;background:#fafafa}
.payment-box{font-size:9px;line-height:1.6}
.check{font-weight:800}.check::before{content:"☐";margin-right:5px;font-size:12px}.check.active::before{content:"☑"}
.features{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:9px;padding:8px 0}
.feature{text-align:center;padding:0 7px;border-right:1px solid var(--line);font-size:8px}
.feature:last-child{border-right:0}.feature b{display:block;font-size:9px;margin-bottom:2px}
.feature-icon{font-size:18px;color:var(--orange);display:block;margin-bottom:2px}
.note-thanks{text-align:center;margin-top:9px;font-size:11px;font-weight:800;color:#555}
.note-thanks strong{color:var(--orange);font-size:13px}
.note-footer{margin:9px -22px -22px;background:#111;color:#fff;border-top:4px solid var(--orange);padding:9px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;font-size:9px;font-weight:800}
.note-footer div:nth-child(2){text-align:center}.note-footer div:nth-child(3){text-align:right}

/* PRINT: UNA SOLA HOJA A4 */
@page{size:A4;margin:5mm}
@media print{
 html,body{background:#fff!important;color:#111!important;margin:0!important;padding:0!important}
 header,.container>.card,.note-actions{display:none!important}
 .container{max-width:none!important;width:100%!important;padding:0!important;margin:0!important}
 #resultado,.note-wrapper{display:block!important;width:100%!important;margin:0!important;padding:0!important}
 .note{max-width:none!important;width:100%!important;padding:5mm!important;margin:0!important;border-radius:0!important;box-shadow:none!important;page-break-inside:avoid!important;break-inside:avoid!important}
 .note-header{padding:7px 10px 6px;border-top-width:3px;border-bottom-width:3px}
 .brand-row{gap:9px}
 .brand-logo{width:45px;height:45px;font-size:17px;border-width:3px}
 .brand-name{font-size:21px}
 .brand-slogan{font-size:8px;margin-top:3px;letter-spacing:.7px}
 .folio-box{min-width:112px;padding:5px 7px;font-size:8px}
 .folio-box b{font-size:9px}.folio-box strong{font-size:10px}
 .contact-bar{padding:4px 2px;font-size:8px;gap:5px}
 .note-title-row{margin:6px 0 4px}
 .note-title{font-size:18px}
 .note-date{font-size:8px}
 .section-label{font-size:9px;border-left-width:4px;padding-left:5px;margin:4px 0 3px}
 .info-grid{grid-template-columns:repeat(3,1fr)!important}
 .info-cell{padding:3px 5px;min-height:28px}
 .info-cell:nth-child(3n){border-right:0}
 .info-cell:nth-last-child(-n+3){border-bottom:0}
 .info-label{font-size:6.5px;margin-bottom:1px}
 .info-value{font-size:8.5px;line-height:1.1}
 .work-box{min-height:25px;padding:3px 5px;font-size:8px}
 .note-table{font-size:7.5px;margin-top:3px}
 .note-table th{padding:3px 4px}.note-table td{padding:2px 4px;height:16px;line-height:1.05}
 .note-table .num{width:20px}.note-table .qty{width:35px}.note-table .money{width:65px}
 .note-bottom{grid-template-columns:1.05fr 1fr 1fr!important;gap:5px;margin-top:5px}
 .total-box,.guarantee-box,.payment-box{min-height:60px;padding:5px}
 .total-row{font-size:7.5px;padding:2px 0}
 .grand-total{margin:4px -5px -5px;padding:5px;font-size:11px}
 .grand-total span:last-child{margin:-5px -5px -5px 0;padding:5px}
 .box-title{font-size:8.5px;margin-bottom:3px}
 .guarantee-box{font-size:7px;line-height:1.2}
 .payment-box{font-size:7px;line-height:1.35}
 .check::before{font-size:9px;margin-right:3px}
 .features{margin-top:5px;padding:4px 0}
 .feature{font-size:6.5px;padding:0 4px;line-height:1.1}.feature b{font-size:7px;margin-bottom:1px}.feature-icon{font-size:11px;margin-bottom:1px}
 .note-thanks{margin-top:4px;font-size:7.5px;line-height:1.15}.note-thanks strong{font-size:9px}
 .note-footer{margin:4px -5mm -5mm;padding:5px 7px;font-size:6.5px;border-top-width:2px}
}

/* MÓVIL */
@media(max-width:600px){
 .container{padding:10px}.card{padding:15px}.grid-2{grid-template-columns:1fr}
 .item-grid{grid-template-columns:1fr 60px 95px 40px}
 .note{padding:13px}
 .brand-name{font-size:23px}.brand-logo{width:52px;height:52px;font-size:19px}
 .folio-box{min-width:115px;font-size:9px}.folio-box strong{font-size:12px}
 .contact-bar{font-size:9px}
 .note-title-row{align-items:flex-start}.note-title{font-size:20px}
 .info-grid{grid-template-columns:1fr 1fr}.info-cell:nth-child(3n){border-right:1px solid var(--line)}
 .info-cell:nth-child(2n){border-right:0}.info-cell:nth-last-child(-n+3){border-bottom:1px solid var(--line)}
 .info-cell:nth-last-child(-n+2){border-bottom:0}
 .note-bottom{grid-template-columns:1fr}
 .features{grid-template-columns:1fr 1fr;gap:5px}.feature:nth-child(2){border-right:0}
 .note-footer{grid-template-columns:1fr;text-align:center!important;gap:4px}.note-footer div{text-align:center!important}
}
</style>
</head>

<body>

<header style="background:#050505;border-bottom:4px solid #ff6a00;padding:22px;text-align:center">
 <div style="font-size:30px;font-weight:900;letter-spacing:2px">MONTOYA <span style="color:#ff6a00">SERVICE</span></div>
 <div style="color:#ccc;margin-top:5px">Tu equipo en buenas manos.</div>
</header>

<div class="container">

<div class="card">
 <h2 class="section-title">🧾 Nueva nota de servicio</h2>

 <div class="grid-2">
  <div><label>Cliente</label><input id="cliente" placeholder="Nombre del cliente"></div>
  <div><label>Teléfono</label><input id="telefono" type="tel" placeholder="Número de teléfono"></div>
 </div>

 <div class="grid-2">
  <div><label>Tipo de equipo</label>
   <select id="equipo"><option>Motosierra</option><option>Desbrozadora</option><option>Generador</option><option>Motobomba</option><option>Motor</option><option>Otro</option></select>
  </div>
  <div><label>Marca</label><input id="marca" placeholder="Ej. Husqvarna"></div>
 </div>

 <div class="grid-2">
  <div><label>Modelo</label><input id="modelo" placeholder="Ej. 365"></div>
  <div><label>Número de serie</label><input id="serie" placeholder="Número de serie"></div>
 </div>

 <label>Trabajo realizado</label>
 <textarea id="trabajo" placeholder="Describe el trabajo realizado..."></textarea>

 <h2 class="section-title" style="margin-top:24px">📦 Servicios / refacciones</h2>
 <div id="items"></div>
 <button class="secondary" onclick="agregarItem()">➕ Agregar concepto</button>

 <div class="grid-2" style="margin-top:8px">
  <div><label>Descuento</label>
   <select id="descuentoPorcentaje">
    <option value="0">Sin descuento</option><option value="5">5%</option><option value="10">10%</option>
    <option value="15">15%</option><option value="20">20%</option><option value="25">25%</option>
    <option value="30">30%</option><option value="40">40%</option><option value="50">50%</option>
   </select>
  </div>
  <div><label>Estado del pago</label>
   <select id="estado"><option>Pagado</option><option>Pendiente</option></select>
  </div>
 </div>

 <div class="summary">
  <div class="summary-row"><span>Subtotal</span><strong>$<span id="subtotal">0.00</span></strong></div>
  <div class="summary-row"><span>Descuento (<span id="porcentajeMostrar">0</span>%)</span><strong>-$<span id="descuentoMonto">0.00</span></strong></div>
  <div class="summary-row total"><span>TOTAL</span><span>$<span id="total">0.00</span></span></div>
 </div>

 <button class="primary" onclick="generarNota()">GENERAR NOTA</button>
</div>

<div class="card">
 <h2 class="section-title">⚙️ Catálogo editable</h2>
 <p style="color:#bbb;font-size:13px">Guarda tus servicios y refacciones frecuentes para tenerlos disponibles al hacer una nota.</p>
 <div class="grid-2">
  <input id="catalogoNombre" placeholder="Ej. Bujía">
  <input id="catalogoPrecio" type="number" placeholder="Precio" step="0.01">
 </div>
 <button class="secondary" onclick="guardarCatalogo()">➕ Guardar en catálogo</button>
 <div id="catalogoLista"></div>
</div>

<div id="resultado"></div>
</div>

<script>
let folio=Number(localStorage.getItem("folioMontoya")||0);
let catalogo=JSON.parse(localStorage.getItem("catalogoMontoya")||"[]");

document.addEventListener("DOMContentLoaded",()=>{
 agregarItem();mostrarCatalogo();calcularTotal();
});

function escapar(t){
 return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function agregarItem(concepto="",cantidad=1,precio=""){
 const n=document.querySelectorAll("#items .item").length;
 if(n>=10){alert("Puedes agregar hasta 10 conceptos.");return}
 const d=document.createElement("div");d.className="item";
 d.innerHTML=`<div class="item-grid">
  <input class="concepto" list="catalogoOpciones" placeholder="Concepto" value="${escapar(concepto)}">
  <input class="cantidad" type="number" min="1" step="1" value="${cantidad}">
  <input class="precio" type="number" min="0" step="0.01" placeholder="Precio" value="${precio}">
  <button class="btn-delete" onclick="eliminarItem(this)">✕</button>
 </div>`;
 document.getElementById("items").appendChild(d);calcularTotal();
}
function eliminarItem(b){
 b.closest(".item").remove();if(!document.querySelector("#items .item"))agregarItem();calcularTotal();
}
document.addEventListener("input",e=>{
 if(e.target.classList.contains("precio")||e.target.classList.contains("cantidad"))calcularTotal();
});
document.addEventListener("change",e=>{
 if(e.target.id==="descuentoPorcentaje")calcularTotal();
});

function calcularTotal(){
 let subtotal=0;
 document.querySelectorAll("#items .item").forEach(i=>{
  subtotal+=(Number(i.querySelector(".cantidad")?.value)||0)*(Number(i.querySelector(".precio")?.value)||0);
 });
 const p=Number(document.getElementById("descuentoPorcentaje")?.value)||0;
 const d=subtotal*p/100,total=Math.max(0,subtotal-d);
 document.getElementById("subtotal").textContent=subtotal.toFixed(2);
 document.getElementById("porcentajeMostrar").textContent=p;
 document.getElementById("descuentoMonto").textContent=d.toFixed(2);
 document.getElementById("total").textContent=total.toFixed(2);
}

function guardarCatalogo(){
 const nombre=document.getElementById("catalogoNombre").value.trim();
 const precio=Number(document.getElementById("catalogoPrecio").value)||0;
 if(!nombre){alert("Escribe el nombre del producto o servicio.");return}
 catalogo.push({nombre,precio});
 localStorage.setItem("catalogoMontoya",JSON.stringify(catalogo));
 document.getElementById("catalogoNombre").value="";
 document.getElementById("catalogoPrecio").value="";
 mostrarCatalogo();
}
function mostrarCatalogo(){
 const lista=document.getElementById("catalogoLista");lista.innerHTML="";
 catalogo.forEach((p,i)=>{
  const d=document.createElement("div");d.className="catalog-row";
  d.innerHTML=`<div class="catalog-name">${escapar(p.nombre)}</div><div class="catalog-price">$${Number(p.precio).toFixed(2)}</div><button class="btn-delete" onclick="eliminarCatalogo(${i})">✕</button>`;
  lista.appendChild(d);
 });
 let dl=document.getElementById("catalogoOpciones");
 if(!dl){dl=document.createElement("datalist");dl.id="catalogoOpciones";document.body.appendChild(dl)}
 dl.innerHTML=catalogo.map(p=>`<option value="${escapar(p.nombre)}">`).join("");
}
function eliminarCatalogo(i){
 catalogo.splice(i,1);localStorage.setItem("catalogoMontoya",JSON.stringify(catalogo));mostrarCatalogo();
}

function generarNota(){
 const cliente=document.getElementById("cliente").value.trim();
 if(!cliente){alert("Escribe el nombre del cliente.");return}
 const telefono=document.getElementById("telefono").value.trim();
 const equipo=document.getElementById("equipo").value;
 const marca=document.getElementById("marca").value.trim();
 const modelo=document.getElementById("modelo").value.trim();
 const serie=document.getElementById("serie").value.trim();
 const trabajo=document.getElementById("trabajo").value.trim();
 const estado=document.getElementById("estado").value;
 const p=Number(document.getElementById("descuentoPorcentaje").value)||0;

 folio++;localStorage.setItem("folioMontoya",folio);
 const numero="MS-"+String(folio).padStart(6,"0");
 const fecha=new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"});

 let filas="",subtotal=0,datos=[];
 document.querySelectorAll("#items .item").forEach(i=>{
  const concepto=i.querySelector(".concepto").value.trim();
  const cantidad=Number(i.querySelector(".cantidad").value)||0;
  const precio=Number(i.querySelector(".precio").value)||0;
  if(concepto&&cantidad>0){
   const importe=cantidad*precio;subtotal+=importe;
   datos.push({concepto,cantidad,precio,importe});
  }
 });
 for(let i=0;i<10;i++){
  const x=datos[i];
  filas+=`<tr><td class="num">${i+1}</td><td>${x?escapar(x.concepto):""}</td><td class="qty">${x?x.cantidad:""}</td><td class="money">${x?"$"+x.precio.toFixed(2):""}</td><td class="money">${x?"$"+x.importe.toFixed(2):""}</td></tr>`;
 }
 const descuento=subtotal*p/100,total=Math.max(0,subtotal-descuento);
 const pagado=estado==="Pagado";

 document.getElementById("resultado").innerHTML=`
 <div class="note-wrapper"><div class="note" id="nota">

  <div class="note-header">
   <div class="brand-row">
    <div class="brand-logo">M<span>S</span></div>
    <div style="flex:1"><div class="brand-name">MONTOYA <span>SERVICE</span></div><div class="brand-slogan">TU EQUIPO EN BUENAS MANOS.</div></div>
    <div class="folio-box"><b>NOTA DE SERVICIO</b><br>Folio: <strong>${numero}</strong><br>Fecha: ${fecha}</div>
   </div>
  </div>

  <div class="contact-bar">
   <div>📞 317 101 4207</div><div>📍 San Juan Xoconusco</div><div>MONTOYA SERVICE</div>
  </div>

  <div class="note-title-row"><div class="note-title">NOTA DE SERVICIO</div><div class="note-date">Documento de servicio<br>${numero}</div></div>

  <div class="section-label">Datos del cliente y equipo</div>
  <div class="info-grid">
   <div class="info-cell"><span class="info-label">Cliente</span><span class="info-value">${escapar(cliente)}</span></div>
   <div class="info-cell"><span class="info-label">Equipo</span><span class="info-value">${escapar(equipo)}</span></div>
   <div class="info-cell"><span class="info-label">Marca</span><span class="info-value">${escapar(marca||"No especificada")}</span></div>
   <div class="info-cell"><span class="info-label">Teléfono</span><span class="info-value">${escapar(telefono||"No registrado")}</span></div>
   <div class="info-cell"><span class="info-label">Modelo</span><span class="info-value">${escapar(modelo||"No especificado")}</span></div>
   <div class="info-cell"><span class="info-label">Estado</span><span class="info-value" style="color:${pagado?"#198754":"#d97706"}">${pagado?"PAGADO":"PENDIENTE"}</span></div>
   <div class="info-cell"><span class="info-label">Número de serie</span><span class="info-value">${escapar(serie||"No registrado")}</span></div>
   <div class="info-cell"><span class="info-label">Trabajo realizado</span><span class="info-value">${escapar(trabajo||"No especificado")}</span></div>
   <div class="info-cell"><span class="info-label">Fecha</span><span class="info-value">${fecha}</span></div>
  </div>

  <div class="section-label">Servicios / refacciones</div>
  <table class="note-table"><thead><tr><th class="num">#</th><th>Concepto</th><th class="qty">Cant.</th><th class="money">Precio</th><th class="money">Importe</th></tr></thead><tbody>${filas}</tbody></table>

  <div class="note-bottom">
   <div class="total-box">
    <div class="total-row"><span>Subtotal</span><b>$${subtotal.toFixed(2)}</b></div>
    <div class="total-row"><span>Descuento (${p}%)</span><b>-$${descuento.toFixed(2)}</b></div>
    <div class="grand-total"><span>TOTAL</span><span>$${total.toFixed(2)}</span></div>
   </div>
   <div class="guarantee-box"><div class="box-title">🛡️ GARANTÍA</div>20 días posteriores a la reparación, únicamente sobre las refacciones instaladas, bajo las condiciones de garantía de Montoya Service.</div>
